name: iOS Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        id: install
        working-directory: frontend
        run: npm ci

      - name: Build React app
        id: react
        working-directory: frontend
        env:
          NODE_OPTIONS: '--openssl-legacy-provider'
          CI: false
        run: npx react-scripts build

      - name: Sync Capacitor iOS
        id: sync
        working-directory: frontend
        run: npx cap sync ios

      - name: Build iOS app (Simulator)
        id: simulator
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tail -40

      - name: Build iOS app (Archive for device, unsigned)
        id: archive
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme App \
            -archivePath build/TiangongTD.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -40

      - name: Upload build artifact
        id: upload
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tiangong-ios-build
          path: frontend/ios/App/build/TiangongTD.xcarchive
          if-no-files-found: error
          retention-days: 30
