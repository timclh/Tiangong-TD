# Render.com Blueprint — Standalone Tiangong TD Static Site
services:
  - type: web
    name: tiangong-td
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    envVars:
      - key: NODE_OPTIONS
        value: --openssl-legacy-provider
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
